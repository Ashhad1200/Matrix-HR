# Production stack for Coolify (build pack: dockercompose). Distinct from the dev-oriented
# docker-compose.yml at the same path (bind mounts + `next dev`/`nest --watch`, not suitable here).
#
# Domain routing: Coolify reads SERVICE_FQDN_<SERVICE> app-level env vars and wires Traefik + TLS to
# whichever port each service `expose`s. Those vars (and every ${...} referenced below) are set on the
# Coolify application itself, not in this file.

services:
  db:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_USER: '${POSTGRES_USER:-matrixhr}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB:-matrixhr}'
    volumes:
      - 'db_data:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-matrixhr} -d ${POSTGRES_DB:-matrixhr}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # minio/minio on Docker Hub was retired; quay.io is MinIO's current registry.
    image: 'quay.io/minio/minio:latest'
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-matrixhr}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD}'
    volumes:
      - 'minio_data:/data'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - '9000'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-matrixhr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-matrixhr}?schema=public'
      JWT_SECRET: '${JWT_SECRET}'
      JWT_REFRESH_SECRET: '${JWT_REFRESH_SECRET}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-15m}'
      JWT_REFRESH_EXPIRES_IN: '${JWT_REFRESH_EXPIRES_IN:-7d}'
      CREDENTIAL_KEY: '${CREDENTIAL_KEY}'
      WEB_URL: '${WEB_URL}'
      API_URL: '${API_URL}'
      APP_VERSION: '${APP_VERSION:-1.0.0}'
      TRUST_PROXY: '${TRUST_PROXY:-1}'
      ENABLE_API_DOCS: '${ENABLE_API_DOCS:-}'
      S3_ENDPOINT: 'http://minio:9000'
      S3_PUBLIC_ENDPOINT: '${S3_PUBLIC_ENDPOINT}'
      S3_ACCESS_KEY: '${S3_ACCESS_KEY}'
      S3_SECRET_KEY: '${S3_SECRET_KEY}'
      S3_BUCKET: '${S3_BUCKET:-matrixhr}'
      S3_REGION: '${S3_REGION:-us-east-1}'
      SMTP_URL: '${SMTP_URL:-}'
      MAIL_FROM: '${MAIL_FROM:-MatrixHR <no-reply@matrixhr.local>}'
      WHATSAPP_TOKEN: '${WHATSAPP_TOKEN:-}'
      WHATSAPP_PHONE_NUMBER_ID: '${WHATSAPP_PHONE_NUMBER_ID:-}'
      WHATSAPP_APP_SECRET: '${WHATSAPP_APP_SECRET:-}'
      WHATSAPP_VERIFY_TOKEN: '${WHATSAPP_VERIFY_TOKEN:-}'
      DEFAULT_TENANT_ID: '${DEFAULT_TENANT_ID:-}'
      GEMINI_API_KEY: '${GEMINI_API_KEY:-}'
      GEMINI_MODEL: '${GEMINI_MODEL:-gemini-2.0-flash}'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:3001/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL}'
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - '3000'

volumes:
  db_data: null
  minio_data: null
